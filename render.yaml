databases:
  - name: onetime-link-db
    plan: basic-256mb
    databaseName: onetime_link
    user: onetime_link_user

services:
  - type: web
    name: onetime-link
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: onetime-link-db
          property: connectionURI
      - key: APP_BASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: DEFAULT_LINK_EXPIRY_HOURS
        value: "24"
      - key: LINK_CREATION_RATE_LIMIT_WINDOW_MIN
        value: "15"
      - key: LINK_CREATION_RATE_LIMIT_MAX
        value: "10"
      - key: ADMIN_LOGIN_RATE_LIMIT_WINDOW_MIN
        value: "15"
      - key: ADMIN_LOGIN_RATE_LIMIT_MAX
        value: "5"
      - key: ALLOW_PUBLIC_LINK_CREATION
        value: "true"
      - key: REQUIRE_INTERSTITIAL_FOR_SUSPECT_UA
        value: "true"
